name = "sabonner"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 占用 Cloudflare 账户 5 个免费 cron 名额中的 1 个。
#   "*/10 * * * *"：定时工作由 VPS 上的运行器（runner/）做，Worker 只每 10 分钟检查一次运行器的心跳（推荐）
#   "* * * * *"   ：不用运行器，Worker 每分钟自己跑全部定时工作（受免费版 10ms CPU 限制，时效差一些）
[triggers]
crons = ["*/10 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "sabonner"
migrations_dir = "migrations"
database_id = "a36ed902-76f2-43f9-90c5-ef78da17472c"

[vars]
# 推送和列表里显示的时区
TZ = "Asia/Shanghai"

# 以下用 `npx wrangler secret put <NAME>` 设置，不要写进仓库：
#   TG_TOKEN           bot token
#   TG_WEBHOOK_SECRET  随机字符串，只能用 A-Z a-z 0-9 _ -
#   ADMIN_TOKEN        你的管理密码（网页写操作、/setup 用）
#   OWNER_ID           你的 Telegram user id

[observability]
enabled = true
